name = "upx-pitch-log"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
VIEW_USER = "upx"
ADMIN_USER = "danny"
# VIEW_PASS, ADMIN_PASS are secrets, never committed:
#   npx wrangler secret put VIEW_PASS
#   npx wrangler secret put ADMIN_PASS

[[d1_databases]]
binding = "DB"
database_name = "upx-pitch-log"
# Replace after `wrangler d1 create upx-pitch-log`:
database_id = "95fc12cc-4713-4136-a78a-f62ef13b279c"

[assets]
directory = "./public"
binding = "ASSETS"
# Every request hits the Worker first — it decides when (and whether, after auth) to
# serve a static file via env.ASSETS.fetch(). Without this, Cloudflare would serve
# matching static paths directly and skip the admin/guest auth gates entirely.
run_worker_first = true
# "none": serve the exact asset path we hand it, no auto-redirect between
# /admin/index.html and /admin/ — the Worker already resolves that path itself,
# and the default trailing-slash handling would redirect it back to /admin/ in a loop.
html_handling = "none"
