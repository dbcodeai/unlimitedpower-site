<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Viewer — Admin</title>
<style>
  body { background:#030916; color:#f4f8ff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         margin:0; padding:32px 20px 80px; }
  h1 { font-size:22px; font-weight:600; margin:0 0 6px; }
  .sub { color:#9aacc4; font-size:14px; margin:0 0 28px; }
  .wrap { max-width:760px; margin:0 auto; }
  .card { background:#0b1730; border:1px solid rgba(178,205,255,.18); border-radius:12px; padding:20px; margin-bottom:16px; }
  .card h2 { font-size:16px; margin:0 0 4px; }
  .card .meta { color:#9aacc4; font-size:13px; margin-bottom:12px; }
  .links { border-top:1px solid rgba(178,205,255,.12); margin-top:12px; padding-top:12px; }
  .link-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0;
              font-size:14px; border-bottom:1px solid rgba(178,205,255,.08); }
  .link-row:last-child { border-bottom:none; }
  .link-row code { background:#030916; padding:2px 6px; border-radius:4px; font-size:12.5px; word-break:break-all; }
  .link-row button { background:none; border:1px solid rgba(255,128,128,.4); color:#ff9a9a; border-radius:6px;
                      padding:4px 10px; font-size:12px; cursor:pointer; }
  input, button.primary { font-size:14px; padding:9px 12px; border-radius:7px; border:1px solid rgba(178,205,255,.3);
                           background:#030916; color:#f4f8ff; }
  button.primary { background:#59dcff; color:#030916; border:none; font-weight:600; cursor:pointer; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .row input { flex:1; min-width:120px; }
  #newItemForm { display:flex; gap:8px; margin-bottom:28px; flex-wrap:wrap; }
  #newItemForm input { flex:1; min-width:140px; }
  .err { color:#ff9a9a; font-size:13px; margin-top:8px; }
  .copyok { color:#7ee787; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Online Viewer</h1>
  <p class="sub">Items we've put online, who has a link, and what they've used it with.</p>

  <form id="newItemForm">
    <input id="newSlug" placeholder="slug (e.g. upx-deck)" required>
    <input id="newTitle" placeholder="Title shown to guests" required>
    <button class="primary" type="submit">Add item</button>
  </form>

  <div id="items"></div>
  <div class="err" id="err"></div>
</div>

<script>
async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  const r = await fetch('/admin/api' + path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function render() {
  const err = document.getElementById('err'); err.textContent = '';
  let items;
  try { items = await api('/items'); } catch (e) { err.textContent = 'Could not load items: ' + e.message; return; }
  const root = document.getElementById('items');
  root.innerHTML = items.map(it => `
    <div class="card" data-item="${it.id}">
      <h2>${esc(it.title)}</h2>
      <div class="meta">/v/&lt;token&gt;/ → public/items/${esc(it.slug)}/</div>
      <div class="links">
        ${(it.links || []).filter(l => !l.revoked).map(l => `
          <div class="link-row">
            <span><b>${esc(l.label || l.username)}</b> — <code>${location.origin}/v/${l.token}/</code> (user: <code>${esc(l.username)}</code>)</span>
            <button data-revoke="${l.id}">Revoke</button>
          </div>`).join('') || '<div class="meta">No guest links yet.</div>'}
      </div>
      <div class="row">
        <input placeholder="Guest name (e.g. Gilad Segev)" class="f-label">
        <input placeholder="username" class="f-user" value="guest">
        <input placeholder="password" class="f-pass">
        <button class="primary" data-newlink="${it.id}">Create link</button>
      </div>
    </div>`).join('') || '<p class="sub">No items yet. Add one above.</p>';

  root.querySelectorAll('[data-newlink]').forEach(btn => btn.addEventListener('click', async () => {
    const card = btn.closest('.card');
    const label = card.querySelector('.f-label').value.trim();
    const username = card.querySelector('.f-user').value.trim();
    const password = card.querySelector('.f-pass').value;
    if (!username || !password) { err.textContent = 'username and password are required for a guest link.'; return; }
    try {
      const link = await api('/items/' + btn.dataset.newlink + '/links', {
        method: 'POST', body: JSON.stringify({ label, username, password }),
      });
      await render();
      const url = location.origin + '/v/' + link.token + '/';
      try { await navigator.clipboard.writeText(url); err.innerHTML = '<span class="copyok">Link copied: ' + esc(url) + '</span>'; }
      catch (e) { err.textContent = 'Link created: ' + url; }
    } catch (e) { err.textContent = 'Could not create link: ' + e.message; }
  }));
  root.querySelectorAll('[data-revoke]').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm('Revoke this link? The guest will no longer be able to log in.')) return;
    try { await api('/links/' + btn.dataset.revoke, { method: 'DELETE' }); await render(); }
    catch (e) { err.textContent = 'Could not revoke: ' + e.message; }
  }));
}

document.getElementById('newItemForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const slug = document.getElementById('newSlug').value.trim();
  const title = document.getElementById('newTitle').value.trim();
  const err = document.getElementById('err'); err.textContent = '';
  try {
    await api('/items', { method: 'POST', body: JSON.stringify({ slug, title }) });
    document.getElementById('newSlug').value = ''; document.getElementById('newTitle').value = '';
    await render();
  } catch (e2) { err.textContent = 'Could not add item: ' + e2.message; }
});

render();
</script>
</body>
</html>
