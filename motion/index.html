<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030406" />
  <meta name="description" content="Unlimited Power builds the future with AI." />
  <link rel="icon" href="data:," />
  <title>Unlimited Power</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #030406;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030406;
    }

    body {
      min-height: 100dvh;
      color: white;
    }

    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 46%, rgba(13, 77, 102, 0.12), transparent 34%),
        #030406;
    }

    .effect {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transform: scale(1.018);
      transition: opacity 900ms cubic-bezier(.22, .61, .36, 1),
                  transform 1400ms cubic-bezier(.22, .61, .36, 1),
                  visibility 0s linear 900ms;
      will-change: opacity, transform;
    }

    .effect.is-active {
      z-index: 1;
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      transition-delay: 0s;
    }

    .effect canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .atmosphere {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 18%, rgba(3, 4, 6, 0.12) 54%, rgba(3, 4, 6, 0.72) 100%),
        linear-gradient(to bottom, rgba(3, 4, 6, 0.16), transparent 30%, transparent 70%, rgba(3, 4, 6, 0.24));
    }

    .brand {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-content: center;
      justify-items: center;
      padding: 24px;
      pointer-events: none;
      text-align: center;
    }

    .brand::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(68vw, 680px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(3, 4, 6, 0.52) 0 20%, rgba(3, 4, 6, 0.24) 43%, transparent 72%);
    }

    .logo {
      position: relative;
      width: clamp(184px, 22vw, 312px);
      height: auto;
      filter: drop-shadow(0 14px 42px rgba(0, 0, 0, 0.62));
    }

    .tagline {
      position: relative;
      margin: clamp(21px, 3vh, 34px) 0 0;
      font-size: clamp(12px, 1.1vw, 16px);
      font-weight: 400;
      line-height: 1.35;
      letter-spacing: 0.22em;
      color: rgba(255, 255, 255, 0.78);
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.9);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .brand { padding: 20px; }
      .logo { width: clamp(176px, 58vw, 246px); }
      .tagline { font-size: 11px; letter-spacing: 0.18em; }
      .brand::before { width: 116vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      .effect { transition: none; transform: none; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Unlimited Power">
    <div class="effect is-active" id="effect-orb" aria-hidden="true"></div>
    <div class="effect" id="effect-strands" aria-hidden="true"></div>
    <div class="effect" id="effect-threads" aria-hidden="true"></div>
    <div class="effect" id="effect-rings" aria-hidden="true"></div>

    <div class="atmosphere" aria-hidden="true"></div>
    <div class="brand">
      <img class="logo" src="../assets/UP-Logo-white.svg" alt="Unlimited Power" />
      <p class="tagline">Building your future...</p>
    </div>
    <p class="sr-only">A rotating motion study for the Unlimited Power identity.</p>
  </main>
