<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:," />
  <title>Pitch Viewers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; background: #000; color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wrap { max-width: 1040px; margin: 0 auto;
      padding: max(40px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    /* ---- login ---- */
    #login { display: flex; flex-direction: column; align-items: center; gap: 24px;
      min-height: 100vh; min-height: 100dvh; justify-content: center; text-align: center; padding: 32px 16px; }
    #login img { width: 56px; height: 56px; opacity: .92; }
    #login h1 { font-size: 20px; font-weight: 600; letter-spacing: .04em; }
    #login form { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
    /* 16px minimum: anything smaller makes iPhone Safari zoom the page on focus */
    #login input {
      min-height: 48px; padding: 12px 16px; font-size: 16px; border-radius: 8px;
      border: 1px solid #2e2e2e; background: #111; color: #f5f5f5; outline: none;
    }
    #login input:focus { border-color: #6a6a6a; }
    #login button {
      min-height: 48px; padding: 12px 26px; font-size: 16px; font-weight: 600; border-radius: 8px; border: none;
      background: #f5f5f5; color: #000; cursor: pointer;
    }
    #login button:hover { background: #fff; }
    #login input:focus-visible, #login button:focus-visible, .ctl:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .msg { font-size: 14px; min-height: 20px; }
    .msg.err { color: #ff6b6b; }
    .msg.warn { color: #e8b44a; }
    /* ---- control bar ---- */
    #controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
    .ctl { display: inline-flex; align-items: center; gap: 7px;
      min-height: 44px; padding: 10px 16px; font-size: 14px; font-weight: 600; border-radius: 8px;
      border: 1px solid #2e2e2e; background: #111; color: #f5f5f5; cursor: pointer;
      text-decoration: none; font-family: inherit; line-height: 1; }
    .ctl:hover { border-color: #6a6a6a; background: #161616; }
    .ctl.primary { background: #f5f5f5; color: #000; border-color: #f5f5f5; }
    .ctl.primary:hover { background: #fff; }
    /* ---- table ---- */
    #report { display: none; }
    #report header { display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    #report h1 { font-size: 20px; font-weight: 600; letter-spacing: .04em; }
    #report .sub { font-size: 13px; color: #9a9a9a; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid #1d1d1d;
      overflow-wrap: anywhere; }
    th { color: #9a9a9a; font-weight: 500; font-size: 12px; text-transform: uppercase;
      letter-spacing: .06em; }
    td.pct { font-variant-numeric: tabular-nums; }
    .bar { display: inline-block; vertical-align: middle; width: 72px; height: 6px;
      background: #1d1d1d; border-radius: 3px; margin-right: 8px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: #f5f5f5; border-radius: 3px; }
    .empty { color: #9a9a9a; padding: 40px 0; text-align: center; font-size: 14px; }
    /* Desktop: only email and IP may wrap; labels, bars, counts and dates stay on one line */
    @media (min-width: 641px) {
      th, td:nth-child(2), td:nth-child(3), td:nth-child(4), td:nth-child(5) {
        white-space: nowrap; overflow-wrap: normal; }
    }
    /* Phone: each viewer becomes a stacked card with every field labeled — nothing hidden */
    @media (max-width: 640px) {
      #controls .ctl { flex: 1 1 auto; justify-content: center; }
      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tr { border: 1px solid #1d1d1d; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: #0b0b0b; }
      td { display: flex; justify-content: space-between; align-items: center; gap: 12px;
        border: none; padding: 5px 0; text-align: right; }
      td::before { content: attr(data-label); color: #9a9a9a; font-size: 12px; text-transform: uppercase;
        letter-spacing: .06em; text-align: left; flex: none; }
      td:first-child { display: block; text-align: left; font-size: 15px; font-weight: 600;
        padding: 0 0 8px; margin-bottom: 4px; border-bottom: 1px solid #1d1d1d; }
      td:first-child::before { display: none; }
    }
  </style>
  <script>
  // Self-heal stale caches: GitHub Pages pins cache-control at max-age=600 and custom
  // headers are impossible here, so the page checks its own freshness. document.lastModified
  // comes from the Last-Modified header of the copy the browser actually loaded; a HEAD
  // request with a cache-busting query reads the live deploy's stamp past both the browser
  // and the Fastly edge. Newer live copy -> one forced reload with a fresh URL.
  (function () {
    if (new URLSearchParams(location.search).has("fresh")) return;
    fetch(location.pathname + "?cb=" + Date.now(), { method: "HEAD", cache: "no-store" })
      .then(function (r) {
        var live = new Date(r.headers.get("Last-Modified") || 0).getTime();
        var mine = new Date(document.lastModified).getTime();
        if (live && mine && live - mine > 5000) location.replace(location.pathname + "?fresh=" + live);
      })
      .catch(function () {});
  })();
  </script>
</head>
<body>
  <div id="login">
    <img src="/assets/UP-Logo-white.svg" alt="Unlimited Power" />
    <h1>Pitch Viewers</h1>
    <form id="loginForm">
      <input type="text" id="user" placeholder="Username" autocomplete="username" required />
      <input type="password" id="pass" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
    </form>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div class="wrap" id="report">
    <nav id="controls">
      <a class="ctl primary" href="/pitch/">&#9654; Watch the video</a>
      <button type="button" class="ctl" id="freshBtn" title="Clears your saved email so /pitch/ shows the sign-in gate like a first-time visitor">Sign-in gate &middot; fresh visitor</button>
      <button type="button" class="ctl" id="refreshBtn">&#8635; Refresh table</button>
    </nav>
    <header>
      <h1>Pitch Viewers</h1>
      <div class="sub" id="sub"></div>
    </header>
    <table>
      <thead><tr><th>Email</th><th>Device</th><th>Watched</th><th>Sessions</th><th>Last seen</th><th>IP</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none"></div>
  </div>

  <script>
    // Data endpoint: the pitch-log Cloudflare Worker's /viewers route. Empty string =
    // backend not deployed yet; the page says so honestly instead of pretending.
    var VIEWERS_ENDPOINT = "https://upx-pitch-log.dannyblumenfeld.workers.dev/viewers";

    var login = document.getElementById("login");
    var report = document.getElementById("report");
    var msg = document.getElementById("loginMsg");

    function fail(text, cls) { msg.textContent = text; msg.className = "msg " + (cls || "err"); }

    function render(rows) {
      login.style.display = "none";
      report.style.display = "block";
      document.getElementById("sub").textContent =
        rows.length + " viewer" + (rows.length === 1 ? "" : "s");
      var tbody = document.getElementById("rows");
      tbody.innerHTML = "";
      var empty = document.getElementById("empty");
      if (!rows.length) {
        empty.textContent = "No viewers logged yet.";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";
      var LABELS = ["Email", "Device", "Watched", "Sessions", "Last seen", "IP"];
      rows.forEach(function (r) {
        var tr = document.createElement("tr");
        function td(text) { var c = document.createElement("td"); c.textContent = text;
          c.setAttribute("data-label", LABELS[tr.children.length]); tr.appendChild(c); return c; }
        td(r.email);
        // Device comes classified from the worker ("mobile" / "desktop" / "both");
        // old rows logged before ua storage show "—".
        td({ mobile: "📱 Mobile", desktop: "🖥️ Desktop",
             both: "📱+🖥️ Both" }[r.device] || "—");
        var pctCell = document.createElement("td");
        pctCell.className = "pct";
        pctCell.setAttribute("data-label", "Watched");
        var bar = document.createElement("span"); bar.className = "bar";
        var fill = document.createElement("i");
        fill.style.width = Math.max(0, Math.min(100, r.watch_pct || 0)) + "%";
        bar.appendChild(fill);
        var pctWrap = document.createElement("span");
        pctWrap.appendChild(bar);
        pctWrap.appendChild(document.createTextNode((r.watch_pct || 0) + "%"));
        pctCell.appendChild(pctWrap);
        tr.appendChild(pctCell);
        td(String(r.sessions || 0));
        td(r.last_seen ? r.last_seen.replace("T", " ").slice(0, 16) : "—");
        td(r.ip || "—");
        tbody.appendChild(tr);
      });
    }

    function load(user, pass) {
      if (!VIEWERS_ENDPOINT) { fail("Data backend is not deployed yet — the login works, the table has no source.", "warn"); return; }
      fetch(VIEWERS_ENDPOINT, { headers: { Authorization: "Basic " + btoa(user + ":" + pass) } })
        .then(function (res) {
          if (res.status === 401) { fail("Wrong username or password."); return null; }
          if (!res.ok) { fail("Backend error (" + res.status + ")."); return null; }
          return res.json();
        })
        .then(function (rows) {
          if (!rows) return;
          try { sessionStorage.setItem("upx_viewers_auth", btoa(user + ":" + pass)); } catch (e) {}
          render(rows);
        })
        .catch(function () { fail("Could not reach the data backend."); });
    }

    document.getElementById("loginForm").addEventListener("submit", function (ev) {
      ev.preventDefault();
      msg.textContent = "";
      load(document.getElementById("user").value.trim(), document.getElementById("pass").value);
    });

    // Control bar: fresh-visitor view clears the saved email (same origin as /pitch/),
    // so the gate page greets you like a first-timer instead of pre-filling.
    document.getElementById("freshBtn").addEventListener("click", function () {
      try { localStorage.removeItem("upx_pitch_email"); } catch (e) {}
      location.href = "/pitch/";
    });
    document.getElementById("refreshBtn").addEventListener("click", function () {
      var saved = null;
      try { saved = sessionStorage.getItem("upx_viewers_auth"); } catch (e) {}
      if (!saved) {
        report.style.display = "none";
        login.style.display = "flex";
        fail("Session expired — sign in again.", "warn");
        return;
      }
      var parts = atob(saved);
      var i = parts.indexOf(":");
      if (i > 0) load(parts.slice(0, i), parts.slice(i + 1));
    });

    // Re-use this tab's session if it already signed in.
    try {
      var saved = sessionStorage.getItem("upx_viewers_auth");
      if (saved && VIEWERS_ENDPOINT) {
        var parts = atob(saved);
        var i = parts.indexOf(":");
        if (i > 0) load(parts.slice(0, i), parts.slice(i + 1));
      }
    } catch (e) {}
  </script>
</body>
</html>
